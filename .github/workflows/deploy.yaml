name: Deployment

on:
  push:
    branches: [ develop, new-version ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Set version
        # Patch number = run number of this workflow, so every deployment shows a new version
        run: |
          sed -i -E "s/code: '([0-9]+\.[0-9]+)\.[0-9]+'/code: '\1.${{ github.run_number }}'/" src/app/version.ts
          grep -q "\.${{ github.run_number }}'" src/app/version.ts
          cat src/app/version.ts

      - name: Prepare and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run ng -- deploy --no-silent --name="Thomas Renger" --email="info@bolzplatzarena.net"
