<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Solar Striker – Retro-Weltraum-Shooter im Browser</title>
  <meta name="description" content="Solar Striker ist ein kostenloser Retro-Weltraum-Shooter für zwischendurch. Direkt im Browser spielen, am Handy oder am PC, ohne Anmeldung.">
  <link rel="canonical" href="https://rengert.github.io/solar-striker/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Solar Striker">
  <meta property="og:title" content="Solar Striker – Retro-Weltraum-Shooter im Browser">
  <meta property="og:description" content="Kostenloser Arcade-Shooter für zwischendurch. Direkt im Browser spielen, ohne Anmeldung.">
  <meta property="og:url" content="https://rengert.github.io/solar-striker/">
  <meta property="og:image" content="https://rengert.github.io/solar-striker/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="de_DE">
  <meta name="twitter:card" content="summary_large_image">
  <noscript><style>#boot-loader { display: none !important; }</style></noscript>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Inline so it paints before the game bundle is downloaded and parsed. -->
  <style>
    html, body { background: #000; }
    #boot-loader {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: radial-gradient(ellipse at center, #10183a 0%, #000 70%);
      color: #ffd23f; font: bold 28px/1.2 system-ui, sans-serif; letter-spacing: 4px;
    }
    #boot-loader::after {
      content: ""; width: 36px; height: 36px; border-radius: 50%;
      border: 4px solid #ffd23f33; border-top-color: #ffd23f;
      animation: boot-spin .8s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot-loader" role="status" aria-label="Loading">SOLAR STRIKER</div>
  <app-root></app-root>
  <noscript style="color:#fff;font-family:sans-serif;text-align:center;display:block;padding:2em">Solar Striker braucht JavaScript. Bitte aktiviere es in deinem Browser.</noscript>
</body>
</html>
